{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | Immunization Analytics</title>
  <link rel="stylesheet" href="{% static 'adminlte/plugins/fontawesome-free/css/all.min.css' %}">
  <link rel="stylesheet" href="{% static 'adminlte/dist/css/adminlte.min.css' %}">
</head>
<body class="hold-transition login-page">
<div class="login-box">
  <div class="card card-outline card-primary">
    <div class="card-header text-center">
      <span class="h2"><i class="fas fa-syringe"></i> Immunization Analytics</span>
    </div>
    <div class="card-body">
      <p class="login-box-msg">Sign in to manage records</p>

      {% if form.errors %}
      <div class="alert alert-danger">Wrong username or password. Please try again.</div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="input-group mb-3">
          <input type="text" name="username" class="form-control" placeholder="Username" autofocus required>
        </div>
        <div class="input-group mb-3">
          <input type="password" name="password" class="form-control" placeholder="Password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
      </form>

      <p class="mt-3 mb-0 text-center"><a href="{% url 'coverage:dashboard' %}">Back to dashboard</a></p>
    </div>
  </div>
</div>
</body>
</html>
